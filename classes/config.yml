# Für den Lobby-Server: mode: LOBBY
# Für den Survival-Server: mode: SURVIVAL
mode: SURVIVAL

# Name des Lobby-Servers in BungeeCord/Velocity; /hub und /lobby verbinden hierhin.
proxy:
  lobby-server: Lobby

# Spieler werden beim Beitritt zum gesetzten Spawn teleportiert.
teleport-to-spawn-on-join: true

# In der Lobby werden Bauen, Abbauen, Schaden und Item-Drops blockiert.
lobby-protection: true

# Zusätzliche Funktionen nur im mode: LOBBY.
lobby:
  force-adventure: true
  void-rescue:
    enabled: true
    y: -10
  protection:
    hunger: true
    item-pickup: true
  selector:
    give-on-join: true
    item: COMPASS
    item-name: "&c&lServer auswählen"
    item-slot: 4
    title: "&8» &c&lServer-Auswahl"
    servers:
      survival:
        target: allinsurvival
        name: "&c&lSurvival"
        material: IRON_SWORD
        slot: 11
        lore:
          - "&7Baue, überlebe und spiele mit Freunden."
          - "&eKlicken zum Verbinden"
      mace:
        target: AllInOne
        name: "&6&lMace PvP"
        material: MACE
        slot: 15
        lore:
          - "&7Kämpfe mit der Mace."
          - "&eKlicken zum Verbinden"

# Lobby-Titel beim Beitritt.
join-title: "&aWillkommen"
join-subtitle: "&7Viel Spaß auf dem Server!"

clans:
  max-members: 8

# Eigene Ränge: Prefixe unterstützen &-Farbcodes. Spielerzuweisungen liegen in ranks.yml.
ranks:
  owner:
    display: Owner
    prefix: "&4&lOWNER"
    weight: 100
    max-homes: 20
    max-homes: 20
  admin:
    display: Admin
    prefix: "&c&lADMIN"
    weight: 90
    max-homes: 12
    max-homes: 12
  moderator:
    display: Moderator
    prefix: "&5MOD"
    weight: 70
    max-homes: 8
    max-homes: 8
  helper:
    display: Helper
    prefix: "&9HELPER"
    weight: 50
    max-homes: 5
    max-homes: 5
  vip:
    display: VIP
    prefix: "&6VIP"
    weight: 30
    max-homes: 3
    max-homes: 3
  member:
    display: Spieler
    prefix: "&7SPIELER"
    weight: 0
    max-homes: 1

voice-menu:
  title: "&8Simple Voice Chat"
  accent: "&c"

rtp:
  world: world
  min-radius: 500
  max-radius: 5000
  cooldown-seconds: 60

# LuckTAB kann parallel den TAB verwalten; aktiviere die Sidebar nur wenn LuckTAB
# keine eigene Sidebar anzeigt.
scoreboard:
  enabled: true
  title: "&6&lAllInOne Survival"
