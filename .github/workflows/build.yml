
name: Build AllInOneMC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Plugin bauen
        run: mvn clean package

      - name: JAR speichern
        uses: actions/upload-artifact@v4
        with:
          name: AllInOneMC
          path: target/*.jar
