name: ServerToolkit
version: 1.13.0
main: dev.codex.servertoolkit.ServerToolkit
api-version: '26.3'
description: Kleine Lobby- und Survival-Werkzeuge in einem Plugin.
softdepend: [Vault, SMPCore, LuckPerms, LuckTAB, voicechat]
commands:
  spawn:
    description: Teleportiert zum Server-Spawn.
    usage: /spawn
  setspawn:
    description: Setzt den Server-Spawn.
    usage: /setspawn
    permission: servertoolkit.admin
  sethome:
    description: Setzt ein Home
    usage: /sethome [Name]
  home:
    description: Teleportiert zu einem Home
    usage: /home [Name]
  homes:
    description: Listet deine Homes
    usage: /homes
  delhome:
    description: Löscht ein Home
    usage: /delhome <Name>
  rtp:
    description: Teleportiert dich zu einem sicheren Zufallsort
    usage: /rtp
  clan:
    description: Clan-System
    usage: /clan
  mace:
    description: Mace-Duelle, Statistiken und Turniere
    usage: /mace
  fly:
    description: Schaltet Fliegen um
    usage: /fly [Spieler]
    permission: servertoolkit.fly
  god:
    description: Schaltet den God-Modus um
    usage: /god [Spieler]
    permission: servertoolkit.god
  invsee:
    description: Öffnet das Inventar eines Spielers
    usage: /invsee <Spieler>
    permission: servertoolkit.staff
  echest:
    description: Öffnet deine Enderchest
    usage: /echest
  ecsee:
    description: Öffnet die Enderchest eines Spielers
    usage: /ecsee <Spieler>
    permission: servertoolkit.staff
  trash:
    description: Öffnet den Papierkorb
    usage: /trash
  ranks:
    description: Öffnet die Rangübersicht
    usage: /ranks [Spieler|gui]
  rank:
    description: Rangverwaltung und Rangmenü
    usage: /rank <gui|list|set|remove|create|perm|color|prefix|homes>
  voice:
    description: Öffnet die Simple-Voice-Chat-Hilfe
    usage: /voice [color <Farbcode>]
  ah:
    description: Auktionshaus
    usage: /ah [sell|cancel]
  order:
    description: Spieler-Aufträge
    usage: /order [create|fill|cancel]
  orders:
    description: Zeigt offene Spieler-Aufträge
    usage: /orders
  kit:
    description: Öffnet das Kit-Menü oder verwaltet Kits.
    usage: /kit [claim|create|delete|cooldown]
  ban:
    description: Bannt einen Spieler mit einem Ban-Preset.
    usage: /ban <Spieler> <Preset>
    permission: servertoolkit.ban
  banrank:
    description: Öffnet die Rang-zu-Rang-Ban-Rechte-GUI.
    usage: /banrank
    permission: servertoolkit.ban.manage
  banpreset:
    description: Verwaltet Ban-Presets per GUI oder Befehl.
    usage: /banpreset [gui|list|set|delete]
    permission: servertoolkit.ban.manage
  banhammer:
    description: Gibt den Banhammer für ein Preset.
    usage: /banhammer <Preset>
    permission: servertoolkit.ban.manage
  vanish:
    description: Schaltet Vanish um oder öffnet die Sichtbarkeits-GUI.
    usage: /vanish [gui|visibility <Zuschauer-Rang> <Vanish-Rang|*> <on|off>]
  money:
    description: Zeigt dein Guthaben oder sendet Geld.
    usage: /money [pay <Spieler> <Betrag>]
  pay:
    description: Sendet Geld an einen Spieler.
    usage: /pay <Spieler> <Betrag>
  eco:
    description: Admin-Befehle für die ServerToolkit-Economy.
    usage: /eco <give|take|set> <Spieler> <Betrag>
  hub:
    description: Wechselt über den Proxy zur Lobby.
    usage: /hub
  lobby:
    description: Wechselt über den Proxy zur Lobby.
    usage: /lobby
  servers:
    description: Öffnet in der Lobby die Serverauswahl.
    usage: /servers
    aliases: [servermenu]
  sit:
    description: Setzt dich auf den Boden oder lässt dich aufstehen.
    usage: /sit [off]
  fakebase:
    description: Platziert eine kleine Fakebase vor dir.
    usage: /fakebase
    permission: servertoolkit.admin
  fakore:
    description: Platziert eine konfigurierbare Erzader unter dir.
    usage: /fakore <erz> [anzahl]
    permission: servertoolkit.admin
permissions:
  servertoolkit.admin:
    description: Darf Server-Spawn, Mace-Arena und Events verwalten.
    default: op
  servertoolkit.staff:
    description: Darf Spieler-Inventare und Enderchests ansehen.
    default: op
  servertoolkit.fly:
    description: Darf Fliegen aktivieren.
    default: op
  servertoolkit.god:
    description: Darf God-Modus aktivieren.
    default: op
  servertoolkit.rank.owner:
    default: false
  servertoolkit.rank.admin:
    default: false
  servertoolkit.rank.moderator:
    default: false
  servertoolkit.rank.helper:
    default: false
  servertoolkit.rank.vip:
    default: false
  servertoolkit.rank.manage:
    description: Darf eigene Ränge erstellen und vergeben.
    default: op
  servertoolkit.rtp:
    description: Darf Zufallsteleport benutzen.
    default: true
  servertoolkit.voice.manage:
    description: Darf die Farbe des Voicechat-Menüs ändern.
    default: op
  servertoolkit.kit.manage:
    description: Darf Kits erstellen, löschen und Cooldowns einstellen.
    default: op
  servertoolkit.ban:
    description: Darf Spieler mit Ban-Presets bannen.
    default: op
  servertoolkit.ban.manage:
    description: Darf Ban-Presets verwalten und Banhammer ausgeben.
    default: op
  servertoolkit.vanish:
    description: Darf Vanish aktivieren.
    default: op
  servertoolkit.vanish.manage:
    description: Darf die Rang-Sichtbarkeit von Vanish konfigurieren.
    default: op
  servertoolkit.vanish.see:
    description: Darf jeden versteckten Spieler sehen.
    default: op
  servertoolkit.money.pay:
    description: Darf Guthaben an andere Spieler senden.
    default: true
  servertoolkit.eco.admin:
    description: Darf ServerToolkit-Guthaben verwalten.
    default: op
