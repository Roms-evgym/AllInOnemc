name: ServerToolkit
version: 1.14.2
main: dev.codex.servertoolkit.ServerToolkit
api-version: '26.3'
description: Kleine Lobby- und Survival-Werkzeuge in einem Plugin.
softdepend: [Vault, SMPCore, LuckPerms, LuckTAB, voicechat, floodgate]
commands:
  register:
    description: Erstellt ein AllInOne-Konto in der Lobby.
    usage: /register <Passwort> <Passwort-wiederholen>
    permission: servertoolkit.auth.use
  login:
    description: Meldet dich in der Lobby bei AllInOne an.
    usage: /login <Passwort>
    permission: servertoolkit.auth.use
  logout:
    description: Meldet dich in der Lobby ab.
    usage: /logout
    permission: servertoolkit.auth.use
  prank:
    description: Aktiviert oder deaktiviert freiwillige Content-Pranks.
    usage: /prank <on|off|status>
  menu:
    description: Öffnet das plattformübergreifende Server-Popup-Menü.
    usage: /menu
    permission: servertoolkit.menu.open
  bounty:
    description: Setzt oder zeigt ein serverübergreifendes Kopfgeld.
    usage: /bounty <Spieler> [Betrag]
  playtime:
    description: Zeigt die serverübergreifende Spielzeit.
    usage: /playtime [Spieler]
  stats:
    description: Zeigt Kills, Tode und Spielzeit.
    usage: /stats [Spieler]
  report:
    description: Sichert die letzten zehn Minuten eines Spielers als Cheat-Report.
    usage: /report <Spieler> [Grund]
    permission: atlas.report
  atlas:
    description: Listet und spielt gespeicherte Spieler-Replays ab.
    usage: /atlas [ID|stop|help]
    permission: atlas.view
  spawn:
    description: Teleportiert zum Server-Spawn.
    usage: /spawn
  setspawn:
    description: Setzt den Server-Spawn.
    usage: /setspawn
    permission: servertoolkit.admin
  sethome:
    description: Setzt ein Home
    usage: /sethome [Name]
  home:
    description: Teleportiert zu einem Home
    usage: /home [Name]
  homes:
    description: Listet deine Homes
    usage: /homes
  delhome:
    description: Löscht ein Home
    usage: /delhome <Name>
  rtp:
    description: Öffnet das Zufalls-Teleport-Menü für Survival, Nether und End.
    usage: /rtp
  shop:
    description: Öffnet den Server-Shop.
    usage: /shop
  sell:
    description: Verkauft Gegenstände aus deiner Hand oder deinem Inventar.
    usage: /sell [hand|all]
  tpa:
    description: Sendet einem Spieler eine Teleportanfrage.
    usage: /tpa <Spieler>
  tpaccept:
    description: Nimmt eine offene Teleportanfrage an.
    usage: /tpaccept
  tpdeny:
    description: Lehnt eine Teleportanfrage ab.
    usage: /tpdeny
  clan:
    description: Clan-System
    usage: /clan [gui|create|invite|accept|leave|disband|info|chat|top]
  mace:
    description: Mace-Duelle, Statistiken und Turniere
    usage: /mace
  clanduel:
    description: Startet ein Clan-Duel zwischen zwei zufälligen Clans.
    usage: /clanduel [stop]
    permission: servertoolkit.clanduel
  fly:
    description: Schaltet Fliegen um
    usage: /fly [Spieler]
    permission: servertoolkit.fly
  god:
    description: Schaltet den God-Modus um
    usage: /god [Spieler]
    permission: servertoolkit.god
  invsee:
    description: Öffnet das Inventar eines Spielers
    usage: /invsee <Spieler>
    permission: servertoolkit.staff
  echest:
    description: Öffnet deine Enderchest
    usage: /echest
  ecsee:
    description: Öffnet die Enderchest eines Spielers
    usage: /ecsee <Spieler>
    permission: servertoolkit.staff
  trash:
    description: Öffnet den Papierkorb
    usage: /trash
  ranks:
    description: Öffnet die Rangübersicht
    usage: /ranks [Spieler|gui]
  rank:
    description: Rangverwaltung und Rangmenü
    usage: /rank <gui|list|set|remove|create|perm|color|prefix|homes>
  voice:
    description: Öffnet die Simple-Voice-Chat-Hilfe
    usage: /voice [color <Farbcode>]
  ah:
    description: Auktionshaus
    usage: /ah [sell|cancel]
  order:
    description: Spieler-Aufträge
    usage: /order [create|fill|cancel]
  orders:
    description: Zeigt offene Spieler-Aufträge
    usage: /orders
  kit:
    description: Öffnet das Kit-Menü oder verwaltet Kits.
    usage: /kit [claim|create|delete|cooldown|access]
  code:
    description: Löst einen Belohnungscode ein.
    usage: /code <Code>
  setcode:
    description: Erstellt einen Rang- oder Geld-Belohnungscode.
    usage: /setcode <Code> rank <Rang>|money <Betrag>
    permission: servertoolkit.code.create
  ban:
    description: Permanenter Vanilla-Spieler-Ban mit Grund.
    usage: /ban <Spieler> [Grund]
    permission: servertoolkit.ban
  punish:
    description: Bestraft einen Spieler mit einem konfigurierten Straf-Preset.
    usage: /punish <Spieler> <Preset>
    permission: servertoolkit.ban
  banrank:
    description: Öffnet die Rang-zu-Rang-Ban-Rechte-GUI.
    usage: /banrank
    permission: servertoolkit.ban.manage
  banpreset:
    description: Verwaltet Ban-Presets per GUI oder Befehl.
    usage: /banpreset [gui|list|set|delete]
    permission: servertoolkit.ban.manage
  banhammer:
    description: Gibt den Banhammer für ein Preset.
    usage: /banhammer <Preset>
    permission: servertoolkit.ban.manage
  vanish:
    description: Schaltet Vanish um oder öffnet die Sichtbarkeits-GUI.
    usage: /vanish [gui|visibility <Zuschauer-Rang> <Vanish-Rang|*> <on|off>]
  money:
    description: Zeigt dein Guthaben oder sendet Geld.
    usage: /money [pay <Spieler> <Betrag>]
  pay:
    description: Sendet Geld an einen Spieler.
    usage: /pay <Spieler> <Betrag>
  eco:
    description: Admin-Befehle für die ServerToolkit-Economy.
    usage: /eco <give|take|set> <Spieler> <Betrag>
  hub:
    description: Wechselt über den Proxy zur Lobby.
    usage: /hub
  lobby:
    description: Wechselt über den Proxy zur Lobby.
    usage: /lobby
  servers:
    description: Öffnet in der Lobby die Serverauswahl.
    usage: /servers
    aliases: [servermenu]
  sit:
    description: Setzt dich auf den Boden oder lässt dich aufstehen.
    usage: /sit [off]
  fakebase:
    description: Platziert eine kleine Fakebase vor dir.
    usage: /fakebase
    permission: servertoolkit.admin
  fakore:
    description: Platziert eine konfigurierbare Erzader unter dir.
    usage: /fakore <erz> [anzahl]
    permission: servertoolkit.admin
